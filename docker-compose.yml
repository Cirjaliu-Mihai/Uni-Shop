services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: unishop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unishop"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  api:
    build: ./backend/UniShop.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Database=unishop;Username=postgres;Password=postgres
      Admin__Email: ${UNISHOP_ADMIN_EMAIL:-}
      Admin__Password: ${UNISHOP_ADMIN_PASSWORD:-}
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  dbdata: